name: Validate resources

on:
  pull_request:
    paths:
      - "entries/**/*.yml"
      - "schemas/resource.schema.json"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema requests

      - name: Validate resource entries
        run: python scripts/validate_resources.py